<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback - French Learning Library</title>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #1f2937;
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: #4b5563;
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            background: #3b82f6;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #1f2937;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Send Us Feedback 💬</h2>
        <p>Let us know how we can improve your learning experience!</p>
        
        <form action="/submit-feedback" method="POST">
            <div class="input-group">
                <input type="text" name="name" placeholder="Your Name" required>
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="Your Email" required>
            </div>
            <div class="input-group">
                <textarea name="message" placeholder="Type your feedback here..." required></textarea>
            </div>
            <button type="submit">Submit Feedback</button>
        </form>
        
        <a href="/library" class="back-link">← Back to Library</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - French Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #4d4482;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 36px;
            background-color: #3f376e;
        }

        .logo {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #e6e3f5;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }

        nav a:hover {
            color: #9be8f0;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 36px 16px;
        }

        .card {
            background-color: #f7f6f2;
            color: #2c2842;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        }

        h2 {
            font-size: 1.65rem;
            font-weight: 700;
            color: #4d4482;
            margin-bottom: 6px;
        }

        .card > p {
            color: #67627d;
            font-size: 0.94rem;
            margin-bottom: 22px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dcd9e8;
            border-radius: 12px;
            background-color: #ffffff;
            color: #2c2842;
            font-size: 0.94rem;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #4d4482;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px 18px;
            background-color: #4d4482;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #3a3266;
            color: #9be8f0;
            transform: translateY(-1px);
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #4d4482;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
    header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 14px 18px;
    }

    nav {
        flex-wrap: wrap;
        gap: 12px 16px;
    }

    nav a {
        font-size: 0.88rem;
    }
}
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">French Vault</a>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/service">Service</a>
            <a href="/library">Library</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>Send Us Feedback</h2>
            <p>Let us know how we can improve your learning experience!</p>

            <form action="/submit-feedback" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Type your feedback here..." required></textarea>
                <button type="submit">Submit Feedback</button>
            </form>

            <a href="/library?username={{ username }}" class="back-link">&larr; Back to Library</a>
        </div>
    </div>
</body>
</html>

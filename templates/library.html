<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library - French Learning Library</title>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 { color: #1f2937; margin-top: 0; }
        p { color: #4b5563; font-size: 14px; margin-bottom: 24px; }
        .resource-btn {
            display: block;
            background: #f3f4f6;
            color: #1f2937;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid #d1d5db;
            transition: all 0.2s;
        }
        .resource-btn:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .footer-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .footer-links a {
            color: #6b7280;
            text-decoration: none;
        }
        .footer-links a:hover { color: #1f2937; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Bienvenue, {{ username }}! 😃</h2>
        <p>You now have access to the French Learning Library. Choose a resource below to start learning:</p>
        
        <a href="/levels/French Grammar Basics?username={{ username }}" class="resource-btn">📊 French Grammar Basics</a>
        <a href="/levels/Beginner Vocabulary Builder?username={{ username }}" class="resource-btn">📚 Beginner Vocabulary Builder</a>
        <a href="/levels/Common French Verbs Guide?username={{ username }}" class="resource-btn">⚡ Common French Verbs Guide</a>
        <a href="/levels/Everyday French Conversation?username={{ username }}" class="resource-btn">💬 Everyday French Conversation</a>
        
        <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
        <a href="{{ url_for('home') }}" style="color: black; font-style: italic;">&larr; Back to Registration</a>
        <div style="text-align: right;">
            <a href="{{ url_for('feedback_page') }}?username={{ username }}">🫰Feedback</a>
            <p style="color: rgb(24, 103, 39); font-size: 11px; margin: 4px 0 0 0;">Produced by Haile G</p>
        </div>
    </div>
</body>
</html>
